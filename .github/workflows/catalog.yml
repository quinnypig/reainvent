name: Deploy marketplace
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e857c740cc49dc71df4e5a92c4aa007b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler d1 migrations apply TREND_DB --remote --config dist/server/wrangler.json
          npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: e857c740cc49dc71df4e5a92c4aa007b
      - name: Configure managed authentication
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/configure-auth.mjs
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
