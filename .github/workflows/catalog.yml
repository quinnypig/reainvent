name: Update catalog

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs can wait behind another refresh. Resolve main when the
          # job starts so a queued run does not try to push from a stale SHA.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh catalog
        if: github.event_name != 'push'
        run: node scripts/update-catalog.mjs
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
      - name: Commit catalog changes
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data.json state/missing.json state/pangram-job.json; then exit 0; fi
          git config user.name "catalog-watch-bot"
          git config user.email "catalog-watch-bot@users.noreply.github.com"
          git add public/data.json state/missing.json state/pangram-job.json
          git commit -m "data: refresh re:Invent catalog [skip ci]"
          git push
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: e857c740cc49dc71df4e5a92c4aa007b
