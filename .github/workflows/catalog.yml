name: Update catalog

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh catalog
        if: github.event_name != 'push'
        run: node scripts/update-catalog.mjs
        env:
          PANGRAM_API_KEY: ${{ secrets.PANGRAM_API_KEY }}
      - name: Commit catalog changes
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data.json state/missing.json; then exit 0; fi
          git config user.name "catalog-watch-bot"
          git config user.email "catalog-watch-bot@users.noreply.github.com"
          git add public/data.json state/missing.json
          git commit -m "data: refresh re:Invent catalog [skip ci]"
          git push
      - run: npm run build
